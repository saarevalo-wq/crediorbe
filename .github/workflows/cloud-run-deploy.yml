name: Deploy server to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/cloud-run-deploy.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: "${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}"

      - id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: crediorbe-server
          region: us-central1
          source: ./server
          project_id: crediorbeapp
          service_account: github-deployer@crediorbeapp.iam.gserviceaccount.com
          env_vars: |
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
            GOOGLE_REDIRECT_URI=${{ secrets.GOOGLE_REDIRECT_URI }}
            VAPID_PUBLIC_KEY=${{ secrets.VAPID_PUBLIC_KEY }}
            VAPID_PRIVATE_KEY=${{ secrets.VAPID_PRIVATE_KEY }}
            VAPID_CONTACT_EMAIL=${{ secrets.VAPID_CONTACT_EMAIL }}
            POLL_SECRET=${{ secrets.POLL_SECRET }}
          flags: --allow-unauthenticated

      - name: Print service URL
        run: echo "Deployed to ${{ steps.deploy.outputs.url }}"

      - uses: google-github-actions/setup-gcloud@v2

      - name: Ensure Cloud Scheduler job (poll every 15 min)
        run: |
          URL="${{ steps.deploy.outputs.url }}/poll"
          if gcloud scheduler jobs describe crediorbe-poll --location=us-central1 --project=crediorbeapp >/dev/null 2>&1; then
            gcloud scheduler jobs update http crediorbe-poll \
              --location=us-central1 --project=crediorbeapp \
              --uri="$URL" --http-method=GET \
              --headers="X-Poll-Secret=${{ secrets.POLL_SECRET }}" \
              --schedule="*/15 * * * *"
          else
            gcloud scheduler jobs create http crediorbe-poll \
              --location=us-central1 --project=crediorbeapp \
              --uri="$URL" --http-method=GET \
              --headers="X-Poll-Secret=${{ secrets.POLL_SECRET }}" \
              --schedule="*/15 * * * *"
          fi
