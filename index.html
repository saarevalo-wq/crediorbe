<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Crediorbe</title>

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ffffff">

<!-- iOS "Add to Home Screen" support -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Crediorbe">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2">

<link rel="icon" href="icons/icon-192.png?v=2">
<link rel="stylesheet" href="css/modernist-styles.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div id="app">

  <!-- Screen 1: Bandeja priorizada -->
  <section id="screen-inbox" class="screen active">
    <header class="topbar">
      <div class="topbar-eyebrow">CREDIORBE</div>
      <div class="topbar-row">
        <h3 class="topbar-title">Crediorbe</h3>
        <div class="unread-pill" id="unread-pill" hidden>
          <span class="unread-dot"></span><span id="unread-count-label">0 sin leer</span>
        </div>
      </div>
    </header>
    <div class="filter-row">
      <div class="seg" id="inbox-filter" role="radiogroup" aria-label="Filtro de bandeja">
        <label class="seg-opt"><input type="radio" name="filter" value="todos" checked><span>Todos</span></label>
        <label class="seg-opt"><input type="radio" name="filter" value="urgente"><span>Urgente</span></label>
        <label class="seg-opt"><input type="radio" name="filter" value="sinleer"><span>Sin leer</span></label>
      </div>
      <div class="topbar-hr"></div>
    </div>
    <div class="scroll">
      <div class="scroll-pad">
        <div id="inbox-error"></div>
        <div id="inbox-connect-gate" class="connect-gate" hidden>
          <h4>Conecta tu correo</h4>
          <p>Conecta tu cuenta de Gmail en Ajustes para ver tus procesos judiciales clasificados.</p>
          <button class="btn btn-primary" id="connect-gate-btn">Ir a Ajustes</button>
          <button class="btn btn-ghost" id="connect-gate-demo-btn">Ver con datos de ejemplo</button>
        </div>
        <div id="inbox-list" class="process-list"></div>
      </div>
    </div>
  </section>

  <!-- Screen 2: Detalle del proceso -->
  <section id="screen-detail" class="screen">
    <header class="topbar">
      <button class="back-row" id="detail-back" type="button">
        <span class="back-chevron"></span> Detalle
      </button>
    </header>
    <div class="scroll">
      <div class="scroll-pad" id="detail-content"></div>
    </div>
    <div class="action-bar" id="detail-actions"></div>
  </section>

  <!-- Screen 3: Ajustes y preferencias de IA -->
  <section id="screen-settings" class="screen">
    <header class="topbar">
      <h3 class="topbar-title">Ajustes</h3>
    </header>
    <div class="scroll">
      <div class="scroll-pad">

        <div class="settings-section">
          <span class="kicker">Cuenta conectada</span>
          <div class="card mailbox-card" id="mailbox-card"></div>
        </div>

        <div class="hr"></div>

        <div class="settings-section">
          <span class="kicker">Prioridad de IA por tipo</span>
          <p class="settings-hint">Define qué tan alto clasifica la IA cada tipo de proceso.</p>
          <div id="priority-rows"></div>
        </div>

        <div class="hr"></div>

        <div class="settings-section">
          <span class="kicker">Notificaciones</span>
          <div class="radio-list" id="notification-radios"></div>
        </div>

        <div class="save-btn-wrap">
          <button class="btn btn-primary btn-block" id="save-settings" disabled>Guardar cambios</button>
        </div>
      </div>
    </div>
  </section>

  <!-- Screen 4: Procesos -->
  <section id="screen-procesos" class="screen">
    <header class="topbar">
      <h3 class="topbar-title">Procesos</h3>
    </header>
    <div class="filter-row">
      <select id="procesos-type-filter" class="input"></select>
      <div class="topbar-hr"></div>
    </div>
    <div class="scroll">
      <div class="scroll-pad">
        <div id="procesos-list" class="process-list"></div>
      </div>
    </div>
  </section>

  <nav class="tabbar">
    <button data-tab="inbox" class="active" type="button">Bandeja</button>
    <button data-tab="procesos" type="button">Procesos</button>
    <button data-tab="settings" type="button">Ajustes</button>
  </nav>
</div>

<div id="toast"></div>

<!-- Google Identity Services (client-side OAuth for Gmail) -->
<script>
  // Catches any uncaught error/rejection — including ones during module
  // load, before app.js's own code runs — and shows it directly on screen.
  // There's no way to remote-debug an iPhone without a Mac, so surfacing
  // errors visibly here is how we find out what's actually failing.
  (function () {
    var shown = false;
    function showFatalError(text) {
      if (shown) return; // only show the first one — avoids stacking banners
      shown = true;
      var el = document.createElement("div");
      el.style.cssText =
        "position:fixed;inset:0;z-index:99999;background:#fff;color:#111;" +
        "font:13px/1.5 -apple-system,sans-serif;padding:16px;overflow:auto;" +
        "white-space:pre-wrap;word-break:break-word;";
      el.textContent = "Error en Crediorbe — copia este texto y envíalo:\n\n" + text;
      var btn = document.createElement("button");
      btn.textContent = "Cerrar";
      btn.style.cssText = "display:block;margin-top:16px;padding:10px 16px;font-size:14px;";
      btn.onclick = function () { el.remove(); };
      el.appendChild(btn);
      document.body.appendChild(el);
    }
    window.addEventListener("error", function (e) {
      showFatalError((e.message || "Error desconocido") + "\n@ " + (e.filename || "?") + ":" + (e.lineno || "?"));
    });
    window.addEventListener("unhandledrejection", function (e) {
      var reason = e.reason;
      var text = reason && reason.stack ? reason.stack : (reason && reason.message) || String(reason);
      showFatalError("Promise rejection:\n" + text);
    });
  })();
</script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
